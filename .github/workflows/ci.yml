name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job here needs write access to the repo.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Compiles every Bicep module. `build` (not `lint`) is deliberate — it
  # catches semantic errors (bad resource types, unresolved symbols) that a
  # lint pass alone lets through.
  # -------------------------------------------------------------------------
  bicep-build:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install && az bicep version

      # Warnings are failures here. `az bicep build` exits 0 on a warning, and the
      # warnings that matter are not stylistic: BCP245 ("can only be used with the
      # 'existing' keyword") means the resource will not deploy at all. A module
      # that compiles to a template which quietly does nothing is exactly the class
      # of failure this lab is built to expose, not tolerate.
      - name: Build each module
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          modules=(bicep/modules/*.bicep)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "No Bicep modules found — skipping."
            exit 0
          fi
          fail=0
          for m in "${modules[@]}"; do
            echo "::group::$m"
            stderr=$(az bicep build --file "$m" --stdout 2>&1 >/dev/null) || { fail=1; }
            if [ -n "$stderr" ]; then
              echo "$stderr"
              echo "::error file=$m::bicep emitted diagnostics (warnings are errors here)"
              fail=1
            else
              echo "clean"
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Build parameter files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          params=(bicep/parameters/*.bicepparam)
          if [ ${#params[@]} -eq 0 ]; then
            echo "No .bicepparam files yet — skipping."
            exit 0
          fi
          fail=0
          for p in "${params[@]}"; do
            echo "::group::$p"
            az bicep build-params --file "$p" --stdout > /dev/null || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # -------------------------------------------------------------------------
  # Pester: parameter validation + naming-convention + repo-hygiene checks.
  # -------------------------------------------------------------------------
  pester:
    name: Pester tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the 6.x major. Validated against 6.0.0 locally; a future
      # Pester 7 could change Run.Exit semantics and turn this gate into a
      # no-op without anyone noticing.
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.999.999 -Force -Scope CurrentUser
          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testResults.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Secret scanning. This is the CI backstop; the local pre-commit hook in
  # .githooks/ is the primary control. See CONTRIBUTING.md.
  #
  # Deliberately the gitleaks CLI, not gitleaks/gitleaks-action@v2. The action
  # scans only the commit range of the triggering event, which broke twice:
  #
  #   push  — the range is `<first-pushed-commit>^..<last>`. When the push
  #           contains the repo's root commit, `<root>^` is not a valid
  #           revision, git aborts, and the action exits 1 having scanned
  #           nothing. It reports "no leaks found in partial scan" on the way
  #           out, which is the worst possible failure mode for a secret
  #           scanner: a red build whose log says clean.
  #   PR    — it calls the pulls API for the commit list, which needs
  #           `pull-requests: read` (and `write` if it posts a comment).
  #           Without it: "Resource not accessible by integration".
  #
  # Scanning full history every run removes both failure modes, needs no
  # GITHUB_TOKEN and no added permissions, and is a real backstop for a commit
  # where the local hook was skipped. Scanning history continuously also beats a
  # one-shot audit: history is what a reader of a public repo actually sees. The
  # repo is small; the whole scan is under a second.
  # -------------------------------------------------------------------------
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a shallow clone would silently scan less

      # Pinned. An unpinned scanner can change its ruleset under you and turn a
      # passing build into a false sense of security (or a surprise red).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1 # matches .githooks/pre-commit's expectation
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Non-zero exit on any finding fails the job. --redact keeps a real secret
      # out of the public build log, which is otherwise a second leak.
      - name: Scan full history
        run: gitleaks git --redact --verbose .

