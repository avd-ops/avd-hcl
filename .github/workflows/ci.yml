# Adapted from this repository's earlier lab kit (same author, MIT, commit de2b9bc); see CREDITS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job here needs write access to the repo.
permissions:
  contents: read

jobs:
  # Formatting, then validate and the offline tests (mock providers, no Azure) in every module
  # and root. tflint and packer fmt join with the image pipeline.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6 # the version the tests were written against
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Validate and test
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for dir in modules/*/ environments/*/*/; do
            # A module with no tests of its own (modules/run-secrets) is validated through the roots.
            if [ ! -d "$dir/tests" ]; then echo "$dir: no tests, checked through the roots"; continue; fi
            echo "::group::$dir"
            if ! (cd "$dir" && terraform init -backend=false -input=false -no-color >/dev/null && terraform validate -no-color && terraform test -no-color); then
              echo "::error::$dir failed validate or test"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  schema:
    name: Parameter schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the schema against the roots
        run: python3 scripts/schema/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/schema

  # Guards for the rules in docs/guardrails.md that a machine can check.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Nerdio in the path, no tracked tfvars or state, no real IDs or emails
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          # Code only: docs may name Nerdio as prior art, and a file adapted from nerdio-hcl names it in
          # its credit header (decision 0002): the whole line must be that header, so nothing else can
          # ride on it. This workflow is excluded because it holds the pattern.
          if git grep -niE 'nerdio' -- '*.tf' '*.tf.json' '*.hcl' '*.sh' '*.ps1' '*.psm1' '*.py' '*.yml' '*.yaml' ':!.github/workflows/ci.yml' \
            | grep -vE '^[^:]+:[0-9]+:(# )?(Adapted from|From) nerdio-hcl \(Apache-2\.0, commit [0-9a-f]+\), [A-Za-z0-9_./-]+;( see CREDITS\.md( and NOTICE)?\.)?$'; then
            echo "::error::No Nerdio provider, API or tool in the kit's code (CLAUDE.md)."
            fail=1
          fi
          tracked=$(git ls-files | grep -E '(^|/)terraform\.tfvars$|\.auto\.tfvars\.json$|\.tfstate(\.backup)?$|\.pkrvars\.hcl$|(^|/)\.terraform/' | grep -vE '(^|/)example\.pkrvars\.hcl$' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::tfvars, state and .terraform/ must never be tracked (guardrail 4)."
            fail=1
          fi
          # Bare GUIDs: only the 00000000-...-0000000000xx placeholders and Microsoft's public IDs in
          # .github/public-ids.txt (each with a comment and a source).
          public=$(grep -vE '^\s*(#|$)' .github/public-ids.txt | paste -sd'|' -)
          if git grep -nIiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' -- . ':!.github/workflows/ci.yml' ':!.github/public-ids.txt' \
            | grep -viE '00000000-0000-0000-0000-0000000000[0-9a-f]{2}' | grep -viE "${public:-^$}"; then
            echo "::error::A GUID that isn't a placeholder is tracked (guardrail 4)."
            fail=1
          fi
          # Emails: only example domains.
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . ':!.github/workflows/ci.yml' | grep -vE '@(contoso\.com|example\.(com|org)|anthropic\.com)|noreply@'; then
            echo "::error::A real-looking email address is tracked (guardrail 4)."
            fail=1
          fi
          exit $fail

  # Secret scanning over full history. The local pre-commit hook in .githooks/ is the primary
  # control. The gitleaks CLI is used instead of the action, which scans only the event's commit
  # range and fails on a root commit or without pull-requests permission.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; a shallow clone would silently scan less
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1 # same version the hook's install instructions name
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --verbose .
