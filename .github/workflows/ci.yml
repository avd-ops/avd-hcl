name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job here needs write access to the repo.
permissions:
  contents: read

jobs:
  # Terraform formatting and validation. Skips cleanly until the first .tf file lands (phase 1).
  terraform:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files '*.tf' '*.tfvars' '*.tftest.hcl' | grep -q .; then
            echo "No Terraform files yet; skipping."
            exit 0
          fi
          terraform fmt -check -recursive -diff

  # Guards for the rules in docs/guardrails.md that a machine can check.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Nerdio in the path, no tracked tfvars or state
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          if git grep -nE 'nerdio/nme|registry\.terraform\.io/nerdio' -- '*.tf' '*.hcl'; then
            echo "::error::The nerdio/nme provider is not allowed here (CLAUDE.md)."
            fail=1
          fi
          tracked=$(git ls-files | grep -E '(^|/)terraform\.tfvars$|\.auto\.tfvars\.json$|\.tfstate(\.backup)?$|\.pkrvars\.hcl$|(^|/)\.terraform/' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::tfvars, state and .terraform/ must never be tracked (guardrail 4)."
            fail=1
          fi
          exit $fail

  # Secret scanning over full history. The local pre-commit hook in .githooks/ is the primary
  # control. The gitleaks CLI is used instead of the action, which scans only the event's commit
  # range and fails on a root commit or without pull-requests permission.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; a shallow clone would silently scan less
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1 # matches .githooks/pre-commit's expectation
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --verbose .
